[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsub"
version = "0.1.0"
description = "Remote-submit SAS code to SAS Viya, move SAS datasets and fetch logs - no shared storage required"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "saspy>=5.100",
    "typer>=0.12",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vsub = "vsub.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
